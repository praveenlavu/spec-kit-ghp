name: ghp strict verify (reusable, secret-free)
# How a consumer repository calls it (tests/fixtures/consumer-example.yml is the full example):
#   on:
#     pull_request:            # not the privileged pull request event
#       types: [opened, synchronize, reopened, edited]   # edited: a base switch after opening re-runs the checks
#   permissions:
#     contents: read
#   jobs:
#     strict-verify:
#       uses: praveenlavu/spec-kit-ghp/.github/workflows/ghp-strict-verify.yml@<40-hex commit>
#       with:
#         ghp_ref: <the same 40-hex commit>
# Pin both to one full commit SHA (`ghp_ref` is required, there is no default): a tag can be moved, and `ghp_ref` decides which ghp is installed (pip,
# from git, at that ref). Installing ghp from git needs the toolkit repository to be readable by the runner (public: there is no token input for the install).
# Known limit: pip's build isolation fetches setuptools (>=61) from PyPI unpinned and without a hash check (SECURITY note, T41).
#
# What it does: only when the TARGET branch's ghp.config.json says mode: strict (`ghp strict mode --base`, source "target branch"), it re-runs
# `ghp strict verify --no-record` on the pull request's head: the recorded red commit must fail and the green commit must pass, under the target
# branch's test command. Otherwise it does nothing (the test command would come from the pull request). Any non-zero exit fails the job; a branch
# that names no issue fails it too. An override in force fails it unless `allow-override` is true.
# SECURITY: it runs the project's test command on the pull request's code. It declares no secret and is given no token (not absolute: on a hosted runner the
# PR's code runs with sudo and could read the job's contents: read token and the runner's own tokens from memory), but a hostile pull request
# can still run code on the runner (network, CPU). Use the fork pull request approval setting and GitHub-hosted (ephemeral) runners.
# Limits: it does not show that a test is meaningful (the pull request still writes the tests at those commits). Call it on `edited` too: a base
# switched from an advisory branch to a strict one after opening fires only `edited`.
on:
  workflow_call:
    inputs:
      ghp_ref:
        description: "The ghp to install: the full 40-character commit SHA of praveenlavu/spec-kit-ghp that the uses: line pins (a vX.Y.Z tag is accepted, not recommended)"
        type: string
        required: true
      allow-override:
        description: "Accept an override in force (an l2 or test-command override skips the very run this job exists for). Default false: the job fails."
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-ghp-strict-verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install ghp
        # Before the checkout, from $RUNNER_TEMP and with -I: no file of the pull request can stand in for pip or ghp.
        env:
          GHP_REF: ${{ inputs.ghp_ref }}
        run: |
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
          if ! [[ "$GHP_REF" =~ ^([0-9a-f]{40}|v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::ghp: ghp_ref must be a full 40-character commit SHA or a vX.Y.Z tag"
            exit 1
          fi
          cd "$RUNNER_TEMP"
          python -I -m pip install --quiet --disable-pip-version-check "spec-kit-ghp @ git+https://github.com/praveenlavu/spec-kit-ghp.git@${GHP_REF}"
          ghp --version
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The PR head commit, not the merge commit: the red and green commits are on it. Full history: origin/<target> must exist.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the target branch
        # ghp reads who may approve from origin/HEAD, which actions/checkout does not create (E_TRUST_BASE_UNRESOLVED otherwise).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "::error::ghp: call this workflow from the pull_request event only"
            exit 1
          fi
          for b in "$BASE_REF" "$DEFAULT_BRANCH"; do
            if ! [[ "$b" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]] || [[ "$b" == *..* ]]; then
              echo "::error::ghp: a branch name holds characters this workflow does not accept"
              exit 1
            fi
            if ! git rev-parse --verify --quiet "refs/remotes/origin/${b}^{commit}" > /dev/null; then
              echo "::error::ghp: origin/${b} does not resolve (the checkout needs fetch-depth: 0), so the target branch's config cannot be read"
              exit 1
            fi
          done
          git remote set-head origin "$DEFAULT_BRANCH"
      - name: Resolve the mode
        id: mode
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
          code=0
          ghp strict mode --base "origin/${BASE_REF}" > "$RUNNER_TEMP/mode.json" 2> "$RUNNER_TEMP/mode.err" || code=$?
          tr '\r' ' ' < "$RUNNER_TEMP/mode.err" | sed 's/^/ghp: /'
          if [ "$code" -ne 0 ]; then
            echo "::error::ghp strict mode exit ${code}: the mode is not known, so the job fails closed"
            exit 1
          fi
          state=$(python3 -I -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d["mode"]+"/"+d["source"])' "$RUNNER_TEMP/mode.json" 2> /dev/null) || state=
          case "$state" in
            "strict/target branch") rerun=yes ;;
            "strict/pull request"|"advisory/pull request") rerun=no ;;
            *) echo "::error::ghp: unexpected output of ghp strict mode"; exit 1 ;;
          esac
          if [ "$rerun" = no ]; then
            echo "::notice::ghp strict verify skipped: the target branch's ghp.config.json is not strict, so the test command is not run (it would come from the pull request)"
          fi
          echo "rerun=${rerun}" >> "$GITHUB_OUTPUT"
      - name: Resolve the issue from the branch
        id: story
        if: steps.mode.outputs.rerun == 'yes'
        env:
          BRANCH: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          MODE: strict
        run: |
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
          if ! [[ "$BRANCH" =~ ^[A-Za-z0-9._#][A-Za-z0-9._/#-]*$ ]] || [[ "$BRANCH" == *..* ]]; then
            echo "::error::ghp: the pull request's branch name holds characters this workflow does not accept"
            exit 1
          fi
          code=0
          ghp branch --id-from="$BRANCH" --base "origin/${BASE_REF}" > "$RUNNER_TEMP/id.json" 2> "$RUNNER_TEMP/id.err" || code=$?
          tr '\r' ' ' < "$RUNNER_TEMP/id.err" | sed 's/^/ghp: /'
          if [ "$code" -eq 1 ] && [ "$MODE" != strict ]; then
            echo "::notice::ghp: the branch name names no issue (<branch_prefix>gh<n>-<slug>, or #<n>), so the gate is skipped (advisory target)"
            echo "id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -eq 1 ]; then
            echo "::error::ghp strict mode: the branch name names no issue (<branch_prefix>gh<n>-<slug>, or #<n>), so the check cannot run and cannot be skipped"
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::ghp branch --id-from exit ${code}: fails closed"
            exit 1
          fi
          id=$(tr -d '\n' < "$RUNNER_TEMP/id.json")
          if ! [[ "$id" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::ghp: unexpected output of ghp branch --id-from"
            exit 1
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"
      - name: Re-run the recorded red and green commits
        if: steps.mode.outputs.rerun == 'yes'
        env:
          STORY_ID: ${{ steps.story.outputs.id }}
          BASE_REF: ${{ github.base_ref }}
          ALLOW_OVERRIDE: ${{ inputs.allow-override }}
        run: |
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
          allow=()
          if [ "$ALLOW_OVERRIDE" = true ]; then allow=(--allow-override); fi
          code=0
          ghp strict verify "$STORY_ID" --no-record --base "origin/${BASE_REF}" ${allow[@]+"${allow[@]}"} > "$RUNNER_TEMP/verify.json" 2> "$RUNNER_TEMP/verify.err" || code=$?
          tr '\r' ' ' < "$RUNNER_TEMP/verify.err" | sed 's/^/ghp: /'
          if [ "$code" -eq 0 ]; then
            echo "ghp strict verify passed."
            exit 0
          fi
          # Rule ids only: a finding's detail can quote ledger text; the tests' own output is never printed.
          rules=$(python3 -I -c 'import json,re,sys;print(" ".join(re.sub("[^A-Za-z0-9_-]","",str(x["rule"]))[:40] for x in json.load(open(sys.argv[1]))["findings"][:20]))' "$RUNNER_TEMP/verify.json" 2> /dev/null) || rules=
          echo "::error::ghp strict verify exit ${code} - rule ids: ${rules:-none (the run could not complete, see the log)}"
          exit 1
