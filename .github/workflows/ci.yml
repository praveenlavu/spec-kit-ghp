name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    # Pinned, not ubuntu-latest: a newer image may have no Python 3.9 build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python and the newest one we test on.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --quiet -e . pytest setuptools wheel
      - name: Run the tests
        run: python -m pytest -q
      - name: Check for leaked names
        env:
          # Optional repository secret, one name per line. With it the tracked files and the whole history (fetch-depth: 0) are scanned for
          # those names; without it only the secret patterns of the tracked files are checked.
          SCRUB_DENYLIST: ${{ secrets.SCRUB_DENYLIST }}
        run: |
          if [ -n "${SCRUB_DENYLIST:-}" ]; then
            python scripts/scrub_check.py --require-denylist --history
          else
            python scripts/scrub_check.py
          fi
      - name: Check the package builds
        run: python -m pip wheel --quiet --no-deps --wheel-dir "$RUNNER_TEMP/wheel" .

  actionlint:
    name: Lint the workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download actionlint (pinned, digest checked)
        env:
          # actionlint v1.7.12 (tag commit 914e7df21a07ef503a81201c76d2b11c789d3fca); the sha256 is the release asset's digest as GitHub lists it.
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
          if ! [[ "$ACTIONLINT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the pinned actionlint digest is not 64 hex characters"
            exit 1
          fi
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 -o "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          # A different digest fails the job before anything from the download runs.
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --strict -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/actionlint" actionlint
      - name: Run actionlint
        run: '"$RUNNER_TEMP/actionlint/actionlint" -color'
