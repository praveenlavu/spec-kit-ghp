name: ghp branch guard (reusable)
# How a consumer repository calls it (tests/fixtures/consumer-example.yml is the full example):
#   on:
#     pull_request:            # not the privileged pull request event
#       types: [opened, synchronize, reopened, edited]   # edited: a base switch after opening re-runs the checks
#   permissions:
#     contents: read
#     issues: read
#   jobs:
#     branch-guard:
#       uses: praveenlavu/spec-kit-ghp/.github/workflows/ghp-branch-guard.yml@<40-hex commit>
#       with:
#         ghp_ref: <the same 40-hex commit>
# Pin both to one full commit SHA (`ghp_ref` is required, there is no default): a tag can be moved, and `ghp_ref` decides which ghp is installed (pip,
# from git, at that ref). Installing ghp from git needs the toolkit repository to be readable by the runner (public: there is no token input for the install).
# Known limit: pip's build isolation fetches setuptools (>=61) from PyPI unpinned and without a hash check (SECURITY note, T41).
#
# What it does: the pull request's branch must name an issue (`ghp branch --id-from`, the CLI's own rule: <branch_prefix>gh<n>-<slug>, or #<n>) and
# that issue must exist (`ghp get`, with the read-only Actions token). The repository the issue is read from comes from the TARGET branch's
# ghp.config.json, never from the pull request's. Any non-zero exit fails the job. No secret.
# Limits: an issue the Actions token cannot read (another repository) fails the job, as a missing one does. The target and default branch
# names must match [A-Za-z0-9._/-] and the PR's branch name [A-Za-z0-9._/#-] (no `..`), or the job fails. Call it on `edited` too (a base switch).
on:
  workflow_call:
    inputs:
      ghp_ref:
        description: "The ghp to install: the full 40-character commit SHA of praveenlavu/spec-kit-ghp that the uses: line pins (a vX.Y.Z tag is accepted, not recommended)"
        type: string
        required: true

permissions:
  contents: read
  issues: read

defaults:
  run:
    shell: bash

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-ghp-branch-guard-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install ghp
        # Before the checkout, from $RUNNER_TEMP and with -I: no file of the pull request can stand in for pip or ghp.
        env:
          GHP_REF: ${{ inputs.ghp_ref }}
        run: |
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
          if ! [[ "$GHP_REF" =~ ^([0-9a-f]{40}|v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::ghp: ghp_ref must be a full 40-character commit SHA or a vX.Y.Z tag"
            exit 1
          fi
          cd "$RUNNER_TEMP"
          python -I -m pip install --quiet --disable-pip-version-check "spec-kit-ghp @ git+https://github.com/praveenlavu/spec-kit-ghp.git@${GHP_REF}"
          ghp --version
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: every branch is fetched, so origin/<target> and origin/<default> exist for the trust reads.
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the target branch
        # ghp reads who may approve from origin/HEAD, which actions/checkout does not create (E_TRUST_BASE_UNRESOLVED otherwise).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "::error::ghp: call this workflow from the pull_request event only"
            exit 1
          fi
          for b in "$BASE_REF" "$DEFAULT_BRANCH"; do
            if ! [[ "$b" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]] || [[ "$b" == *..* ]]; then
              echo "::error::ghp: a branch name holds characters this workflow does not accept"
              exit 1
            fi
            if ! git rev-parse --verify --quiet "refs/remotes/origin/${b}^{commit}" > /dev/null; then
              echo "::error::ghp: origin/${b} does not resolve (the checkout needs fetch-depth: 0), so the target branch's config cannot be read"
              exit 1
            fi
          done
          git remote set-head origin "$DEFAULT_BRANCH"
      - name: Check the branch names an existing issue
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
          if ! [[ "$BRANCH" =~ ^[A-Za-z0-9._#][A-Za-z0-9._/#-]*$ ]] || [[ "$BRANCH" == *..* ]]; then
            echo "::error::ghp: the pull request's branch name holds characters this workflow does not accept"
            exit 1
          fi
          code=0
          ghp branch --id-from="$BRANCH" --base "origin/${BASE_REF}" > "$RUNNER_TEMP/id.json" 2> "$RUNNER_TEMP/id.err" || code=$?
          tr '\r' ' ' < "$RUNNER_TEMP/id.err" | sed 's/^/ghp: /'
          if [ "$code" -eq 1 ]; then
            echo "::error::ghp: the branch name names no issue (expected <branch_prefix>gh<n>-<slug>, e.g. feature/gh12-thing, or #<n>)"
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::ghp branch --id-from exit ${code}: fails closed"
            exit 1
          fi
          id=$(tr -d '\n' < "$RUNNER_TEMP/id.json")
          if ! [[ "$id" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::ghp: unexpected output of ghp branch --id-from"
            exit 1
          fi
          # The repository comes from the target branch's config: a pull request cannot point the read at another repository.
          if ! git show "origin/${BASE_REF}:ghp.config.json" > "$RUNNER_TEMP/target.config.json" 2> /dev/null; then
            echo "::error::ghp: the target branch has no ghp.config.json, so the issue's repository is not known"
            exit 1
          fi
          code=0
          GHP_CONFIG="$RUNNER_TEMP/target.config.json" ghp get "$id" > /dev/null 2> "$RUNNER_TEMP/get.err" || code=$?
          tr '\r' ' ' < "$RUNNER_TEMP/get.err" | sed 's/^/ghp: /'
          if [ "$code" -ne 0 ]; then
            echo "::error::ghp: issue #${id} could not be read (ghp get exit ${code}): it does not exist, is a pull request, or the token cannot read it"
            exit 1
          fi
          echo "Issue #${id} exists."
