name: Commit messages

on:
  pull_request:

permissions:
  contents: read

jobs:
  subjects:
    name: Check commit subjects
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check each commit subject
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$BASE_SHA" | grep -qE '^[0-9a-f]{40}$' || { echo "::error::the base is not a commit id"; exit 1; }
          git log --format=%s "$BASE_SHA..HEAD" | python3 scripts/commit_lint.py
