<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Spec Kit for GitHub Projects</title>
  <desc id="desc">Less board upkeep. More time to build. Agents prepare tasks, documentation and evidence; people review changes and make decisions.</desc>
  <rect width="1200" height="360" rx="20" fill="#101827"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#354258"/>
  <path d="M56 57h38" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="108" y="64" font-size="17" font-weight="600" letter-spacing="2" fill="#c4b5fd">SPEC KIT / GITHUB PROJECTS</text>
    <text x="56" y="139" font-size="48" font-weight="700" fill="#f7fafc">Less board upkeep.</text>
    <text x="56" y="197" font-size="48" font-weight="700" fill="#f7fafc">More time to build.</text>
    <text x="58" y="249" font-size="20" fill="#b5c2d6">Agents prepare the work. Your team makes the decisions.</text>
    <text x="58" y="315" font-size="16" fill="#b5c2d6">spec-kit-ghp</text>
    <text x="260" y="315" font-size="16" fill="#b5c2d6">by Praveen Lavu</text>
    <rect x="820" y="74" width="324" height="212" rx="12" fill="#182437" stroke="#354258"/>
    <text x="846" y="111" font-size="14" font-weight="600" letter-spacing="1.5" fill="#c4b5fd">THE DELIVERY RECORD</text>
    <path d="M846 130h272" stroke="#354258"/>
    <g font-size="19" fill="#e0e7f0">
      <text x="876" y="167">Tasks and board updates</text>
      <text x="876" y="211">Questions and decisions</text>
      <text x="876" y="255">Tests and review notes</text>
    </g>
    <g fill="none" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m846 159 6 6 10-12"/><path d="m846 203 6 6 10-12"/><path d="m846 247 6 6 10-12"/>
    </g>
  </g>
</svg>
